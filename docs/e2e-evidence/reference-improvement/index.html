<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O Chat · UI 修改前后</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f7f9;color:#242126;font:15px/1.65 system-ui,sans-serif}main{max-width:1520px;margin:auto;padding:28px}h1{font-size:24px;margin:0 0 10px}p{max-width:780px;color:#57535f;margin:8px 0}a{color:#624593}label{display:block;font-weight:600;margin:24px 0 8px}select{font:inherit;max-width:100%;padding:10px 36px 10px 12px;background:white;border:1px solid #c8c3ce;border-radius:6px}section{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}figure{margin:0;text-align:center}figcaption{font-weight:600;text-align:left;margin-bottom:12px}figure a{display:block}img{display:block;max-width:100%;width:auto;height:auto;max-height:none;margin:auto;border:1px solid #e5e2e9;background:white}.phone{max-width:900px}small{display:block;font-weight:400;color:#57535f}footer{border-top:1px solid #e5e2e9;margin-top:32px;padding-top:16px;color:#57535f}@media(max-width:650px){main{padding:20px}section{grid-template-columns:1fr}h1{font-size:22px}}</style>
<main><h1>O Chat：让结果回到界面中心</h1><p>本轮让新任务从阅读区顶部开始，旧对话可正常上滚查看；完成结果、一个详情入口和输入区保持清楚次序。权限和审批持续可见。</p><p><a href="../../REFERENCE_UI_AUDIT.md">10 项审计、测试与限制</a> · 点击图片查看原始尺寸。</p><label for="scene">选择对比场景</label><select id="scene"></select><section id="comparison"><figure><figcaption>修改前<small><span id="before-source">基线</span></small></figcaption><a id="before-link"><img id="before" alt="修改前"></a></figure><figure><figcaption>修改后<small>本轮生产构建 · 来源与限制见审计记录</small></figcaption><a id="after-link"><img id="after" alt="修改后"></a></figure></section><footer>本页增加真实多轮复查所发现的新任务拥挤问题。新任务场景的基线是已部署 b7b4c27；原构图场景仍保留 8d5ada9 对比。已有正文进度行的测试事件也改为 llm_call，不能把这一测试差异算成新增产品功能。独立 AI 视觉复审与功能检查分别记录在审计中；完整手机外部参考比较仍为证据不足。</footer></main><script>
const scenes=[
  ["task-phone","新任务 · 390 × 667","../current-task-focus/before/current-task-390.png","a-new-task-leads-the-conversation-after-long-history-at-390px--current-task.png","b7b4c27"],
  ["task-desktop","新任务 · 1440 × 900","../current-task-focus/before/current-task-1440.png","a-new-task-leads-the-conversation-after-long-history-at-1440px--current-task.png","b7b4c27"],
  ["chat-phone","完成结果 · 390 × 667","production/completed-work-has-a-clear-reading-surface-at-390x667--completed.png","completed-work-has-a-clear-reading-surface-at-390x667--completed.png","8d5ada9"],
  ["chat-desktop","完成结果 · 1440 × 900","production/completed-work-has-a-clear-reading-surface-at-1440x900--completed.png","completed-work-has-a-clear-reading-surface-at-1440x900--completed.png","8d5ada9"],
  ["room-phone","手机 Work Room · 390 × 844","production/work-room-prioritises-the-result-at-390px--completed-workroom.png","work-room-prioritises-the-result-at-390px--completed-workroom.png","8d5ada9"],
  ["room-desktop","桌面 Work Room · 1440 × 900","production/work-room-prioritises-the-result-at-1440px--completed-workroom.png","work-room-prioritises-the-result-at-1440px--completed-workroom.png","8d5ada9"]
];
const select=document.querySelector('#scene');
for(const [id,label] of scenes){const option=document.createElement('option');option.value=id;option.textContent=label;select.append(option)}
function render(){
  const [id,label,before,after,source]=scenes.find(s=>s[0]===select.value);
  for(const [side,path] of [['before',before],['after','../current-task-focus/production/'+after]]){
    document.getElementById(side).src=path;
    document.getElementById(side).alt=label+' '+(side==='before'?'修改前':'修改后');
    document.getElementById(side+'-link').href=path;
  }
  document.getElementById('before-source').textContent='基线 '+source;
  document.querySelector('#comparison').className=id.endsWith('phone')?'phone':'';
}
select.addEventListener('change',render);render();
</script></html>
