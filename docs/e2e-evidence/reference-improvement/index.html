<style>*{box-sizing:border-box}body{margin:0;background:#f7f7f9;color:#242126;font:15px/1.65 system-ui,sans-serif}main{max-width:1520px;margin:auto;padding:28px}h1{font-size:24px;margin:0 0 10px}p{max-width:780px;color:#57535f;margin:8px 0}a{color:#624593}label{display:block;font-weight:600;margin:24px 0 8px}select{font:inherit;max-width:100%;padding:10px 36px 10px 12px;background:white;border:1px solid #c8c3ce;border-radius:6px}section{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}figure{margin:0;text-align:center}figcaption{font-weight:600;text-align:left;margin-bottom:12px}figure a{display:block}img{display:block;max-width:100%;width:auto;height:auto;max-height:none;margin:auto;border:1px solid #e5e2e9;background:white}.phone{max-width:900px}small{display:block;font-weight:400;color:#57535f}footer{border-top:1px solid #e5e2e9;margin-top:32px;padding-top:16px;color:#57535f}@media(max-width:650px){main{padding:20px}section{grid-template-columns:1fr}h1{font-size:22px}}</style>
<main><h1>O Chat：让结果回到界面中心</h1><p>本轮调整完成计划、阅读位置、侧栏和 Work Room。保留真实内容、权限决定和可展开的过程记录。</p><p><a href="../../REFERENCE_UI_AUDIT.md">10 项审计、测试与限制</a> · 点击图片查看原始尺寸。</p><label for="scene">选择对比场景</label><select id="scene"></select><section id="comparison"><figure><figcaption>修改前<small>应用基线 d3d1c91</small></figcaption><a id="before-link"><img id="before" alt="修改前"></a></figure><figure><figcaption>修改后<small>本轮生产构建截图</small></figcaption><a id="after-link"><img id="after" alt="修改后"></a></figure></section><footer>独立 AI 审阅：本轮阅读密度与层级局部通过。普通聊天的结构化交付物仍需数据契约支持。Work Room 的旧测试请求曾与排序文件错配，最终已修正；报告保留了这一可比性说明。未进行新的真实 Host 发布验收或部署。</footer></main><script>
const scenes=[["chat-phone", "手机聊天 · 390 × 667", "completed-work-has-a-clear-reading-surface-at-390x667--completed.png"], ["chat-desktop", "桌面聊天 · 1440 × 900", "completed-work-has-a-clear-reading-surface-at-1440x900--completed.png"], ["room-phone", "手机 Work Room · 390 × 844", "work-room-prioritises-the-result-at-390px--completed-workroom.png"], ["room-desktop", "桌面 Work Room · 1440 × 900", "work-room-prioritises-the-result-at-1440px--completed-workroom.png"]];const select=document.querySelector('#scene');for(const [id,label] of scenes){const option=document.createElement('option');option.value=id;option.textContent=label;select.append(option)}
function render(){const [id,label,file]=scenes.find(s=>s[0]===select.value);for(const [side,folder] of [['before','before'],['after','production']]){document.getElementById(side).src=folder+'/'+file;document.getElementById(side).alt=label+' '+(side==='before'?'修改前':'修改后');document.getElementById(side+'-link').href=folder+'/'+file}document.querySelector('#comparison').className=id.endsWith('phone')?'phone':''}select.addEventListener('change',render);render();
</script></html>
